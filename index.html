<!DOCTYPE html>
<html lang="hy">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Բարև աշխարհ</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #d90012 0%, #0033a0 100%);
      color: #fff;
      text-align: center;
      padding: 16px;
    }

    .card {
      background: rgba(0, 0, 0, 0.35);
      padding: 48px 40px;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
    }

    h1 {
      font-size: clamp(2.5rem, 8vw, 5rem);
      margin-bottom: 12px;
    }

    p {
      font-size: 1.2rem;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Բարև աշխարհ 👋</h1>
    <p>Hello, World!</p>
  </div>
</body>
</html>
